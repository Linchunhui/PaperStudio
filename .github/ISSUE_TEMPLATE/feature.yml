name: Feature / 场景建议
description: 描述你想完成的研究工作 / Describe the research workflow
body:
  - type: textarea
    id: task
    attributes:
      label: 想完成什么？ / What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: obstacle
    attributes:
      label: 目前在哪里受阻？ / Where does the current flow fail?
    validations:
      required: true
  - type: textarea
    id: success
    attributes:
      label: 什么结果算解决？ / What would success look like?
