name: Checks and containers
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: bash scripts/check.sh
      - run: python scripts/package_data.py --output dist
      - run: python scripts/verify_data_package.py dist
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt -r requirements-browser.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-screenshots
          path: test-results/
          retention-days: 14
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [core, full, codex]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          load: true
          tags: paperstudio:check
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
      - run: python scripts/container_smoke.py paperstudio:check
      - if: matrix.target == 'codex'
        run: docker run --rm --entrypoint codex paperstudio:check --version
      - if: matrix.target == 'full'
        run: docker run --rm --entrypoint python paperstudio:check -c "from pathlib import Path; assert all((Path('config')/p/'manifest.json').is_file() for p in ('catalog','relations','reading-cards'))"
  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.repository == 'Linchunhui/PaperStudio'
    needs: [checks, browser, container]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide immutable release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish verified images
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NEW_RELEASE: ${{ steps.release.outputs.new }}
        run: |
          for target in core full codex; do
            suffix="-$target"
            if [ "$target" = core ]; then suffix=""; fi
            tags=(--tag "ghcr.io/linchunhui/paperstudio:sha-${GITHUB_SHA}${suffix}" --tag "ghcr.io/linchunhui/paperstudio:edge${suffix}")
            if [ "$NEW_RELEASE" = true ]; then tags+=(--tag "ghcr.io/linchunhui/paperstudio:${VERSION}${suffix}"); fi
            docker buildx build --target "$target" --platform linux/amd64 --push \
              --build-arg "VERSION=$VERSION" --build-arg "REVISION=$GITHUB_SHA" \
              --cache-from "type=gha,scope=$target" "${tags[@]}" .
          done
      - name: Package full data and public demo
        if: steps.release.outputs.new == 'true'
        run: |
          python scripts/package_data.py --output dist
          python scripts/verify_data_package.py dist
          cp compose.release.yaml dist/
          python -c "import shutil; shutil.make_archive('dist/paperstudio-demo', 'zip', 'demo')"
          cd dist
          sha256sum paperstudio-data.tar.gz compose.release.yaml paperstudio-demo.zip > SHA256SUMS
      - name: Create release after all checks pass
        if: steps.release.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "PaperStudio $VERSION" --notes-file "docs/releases/$VERSION.md"
